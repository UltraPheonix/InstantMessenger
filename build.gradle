plugins {
  id 'java'
  id 'application'
  id 'org.javamodularity.moduleplugin' version '1.8.15'
  id 'org.openjfx.javafxplugin' version '0.1.0'
  id 'org.beryx.jlink' version '3.0.1'
}

group = 'InstantMessengerZaga'
version = '1'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.11.4'
}

jar{
  manifest {
    attributes "Main-Class" : ''
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'instantmessengerzaga.instantmessenger'
  mainClass = 'instantmessengerzaga.instantmessenger.MessengerApplication'
}

javafx {
  version = '21'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
  useJUnitPlatform()  }

jlink {
  imageZip = layout.buildDirectory.file("distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'app'
  }
}

jlinkZip {
  group = 'distribution'
}